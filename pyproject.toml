[project]
name = "football-team-assistant"
version = "0.1.0"
description = "AI agent that acts as a football team manager assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6,<1",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]