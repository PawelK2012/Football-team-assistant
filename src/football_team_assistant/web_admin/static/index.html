<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Football Admin</title>
  <link rel="stylesheet" href="/admin/static/admin.css">
  <script src="/admin/static/admin.js" defer></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Football Assistant</div>
      <nav aria-label="Admin panel">
        <a href="/admin/players">Players</a>
        <a href="/admin/fixtures">Fixtures</a>
        <a href="/admin/availability">Availability</a>
      </nav>
    </aside>
    <main>
      <header class="page-header">
        <h1 id="page-title"></h1>
        <button type="button" id="new-record" hidden></button>
      </header>
      <p id="status" role="status" tabindex="-1"></p>
      <section id="content" aria-labelledby="page-title"></section>
    </main>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <h2 id="dialog-title"></h2>
    <div id="dialog-content"></div>
  </dialog>
</body>
</html>
